<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Standleo Lobby</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app">
        <header class="header">
            <div class="logo">
                <span class="logo-icon">⚔️</span>
                <span class="logo-text">Standleo</span>
            </div>
        </header>

        <main class="content">

            <!-- ВКЛАДКА: ПРОФИЛЬ -->
            <section class="tab-content active" id="tab-profile">

                <!-- Шапка: аватар + ник + ELO -->
                <div class="profile-header">
                    <div class="avatar" id="profile-avatar">?</div>
                    <div class="profile-head-info">
                        <h2 class="profile-nick" id="profile-nick">Загрузка...</h2>
                        <div class="profile-elo-badge">
                            <span class="elo-badge-label">ELO</span>
                            <span class="elo-badge-value" id="header-elo">0</span>
                        </div>
                    </div>
                </div>

                <!-- Верхний ряд метрик -->
                <div class="metric-grid">
                    <div class="metric-card">
                        <div class="metric-label">КД</div>
                        <div class="metric-value" id="card-kd">0.00</div>
                    </div>
                    <div class="metric-card">
                        <div class="metric-label">Винрейт</div>
                        <div class="metric-value" id="card-winrate">0%</div>
                    </div>
                    <div class="metric-card">
                        <div class="metric-label">Матчей</div>
                        <div class="metric-value" id="card-matches">0</div>
                    </div>
                </div>

                <!-- Нижний ряд метрик -->
                <div class="metric-grid">
                    <div class="metric-card">
                        <div class="metric-label">Убийств</div>
                        <div class="metric-value win" id="card-kills">0</div>
                    </div>
                    <div class="metric-card">
                        <div class="metric-label">Смертей</div>
                        <div class="metric-value lose" id="card-deaths">0</div>
                    </div>
                    <div class="metric-card">
                        <div class="metric-label">Монет</div>
                        <div class="metric-value gold" id="card-coins">0</div>
                    </div>
                </div>

                <!-- W / L + Место в топе -->
                <div class="card wide-card">
                    <div class="wl-block">
                        <div class="wl-item">
                            <div class="wl-value win" id="wl-wins">0</div>
                            <div class="wl-label">Побед</div>
                        </div>
                        <div class="wl-divider"></div>
                        <div class="wl-item">
                            <div class="wl-value lose" id="wl-losses">0</div>
                            <div class="wl-label">Поражений</div>
                        </div>
                        <div class="wl-divider"></div>
                        <div class="wl-item">
                            <div class="wl-value" id="wl-top">#—</div>
                            <div class="wl-label">Место в топе</div>
                        </div>
                    </div>
                </div>

                <!-- КД по картам -->
                <div class="card wide-card">
                    <h3 class="card-title">КД по картам</h3>
                    <div class="maps-list" id="kd-maps-list"></div>
                </div>

                <!-- Винрейт по картам -->
                <div class="card wide-card">
                    <h3 class="card-title">Винрейт по картам</h3>
                    <div class="maps-list" id="wr-maps-list"></div>
                </div>

            </section>

            <!-- ВКЛАДКА: ЛОББИ -->
            <section class="tab-content" id="tab-create">
                <h2 class="section-title">Создать лобби</h2>

                <form id="lobby-form" class="lobby-form">
                    <div class="card wide-card">
                        <div class="form-group">
                            <label class="form-label">Режим</label>
                            <div class="chips" id="mode-chips">
                                <button type="button" class="chip" data-value="1x1">1х1</button>
                                <button type="button" class="chip" data-value="2x2">2х2</button>
                                <button type="button" class="chip" data-value="3x3">3х3</button>
                                <button type="button" class="chip" data-value="4x4">4х4</button>
                                <button type="button" class="chip active" data-value="5x5">5х5</button>
                            </div>
                            <input type="hidden" name="mode" id="mode-input" value="5x5">
                        </div>
                    </div>

                    <div class="card wide-card">
                        <div class="form-group">
                            <label class="form-label">Карта</label>
                            <div class="chips" id="map-chips">
                                <button type="button" class="chip active" data-value="Sandstone">Sandstone</button>
                                <button type="button" class="chip" data-value="Province">Province</button>
                                <button type="button" class="chip" data-value="Rust">Rust</button>
                                <button type="button" class="chip" data-value="Prison">Prison</button>
                                <button type="button" class="chip" data-value="Hanami">Hanami</button>
                            </div>
                            <input type="hidden" name="map" id="map-input" value="Sandstone">
                        </div>
                    </div>

                    <div class="card wide-card">
                        <div class="form-group">
                            <label class="form-label">Комментарий</label>
                            <textarea
                                name="comment"
                                class="form-input"
                                placeholder="Например: нужен микрофон..."
                                rows="3"
                                maxlength="200"
                            ></textarea>
                        </div>
                    </div>

                    <button type="submit" class="btn-primary">
                        🚀 Создать лобби
                    </button>
                </form>
            </section>

            <!-- ВКЛАДКА: ТОП -->
            <section class="tab-content" id="tab-top">
                <h2 class="section-title">Топ игроков</h2>
                <div class="top-list" id="top-list"></div>
            </section>

        </main>

        <nav class="tabbar">
            <button class="tab-btn active" data-tab="profile">
                <span class="tab-icon">👤</span>
                <span class="tab-text">Профиль</span>
            </button>
            <button class="tab-btn" data-tab="create">
                <span class="tab-icon">🎮</span>
                <span class="tab-text">Лобби</span>
            </button>
            <button class="tab-btn" data-tab="top">
                <span class="tab-icon">🏆</span>
                <span class="tab-text">Топ</span>
            </button>
        </nav>
    </div>

    <div class="toast" id="toast"></div>

    <script src="app.js"></script>
</body>
</html>
