<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Standleo Lobby</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app">
        <!-- Шапка -->
        <header class="header">
            <div class="logo">
                <span class="logo-icon">⚔️</span>
                <span class="logo-text">Standleo</span>
            </div>
        </header>

        <!-- Контент вкладок -->
        <main class="content">

            <!-- ВКЛАДКА: ПРОФИЛЬ -->
            <section class="tab-content active" id="tab-profile">

                <!-- Верхняя карточка: аватар + ник + ELO/KD/K/D -->
                <div class="profile-header">
                    <div class="avatar" id="profile-avatar">?</div>
                    <div class="profile-head-info">
                        <h2 class="profile-nick" id="profile-nick">Загрузка...</h2>
                        <div class="profile-rank" id="profile-rank">Новичок</div>
                        <div class="profile-meta">
                            <span class="meta-item">
                                <span class="meta-label">ELO</span>
                                <span class="meta-value" id="meta-elo">0</span>
                            </span>
                            <span class="meta-sep">•</span>
                            <span class="meta-item">
                                <span class="meta-label">КД</span>
                                <span class="meta-value" id="meta-kd">0.00</span>
                            </span>
                            <span class="meta-sep">•</span>
                            <span class="meta-item">
                                <span class="meta-label">У</span>
                                <span class="meta-value" id="meta-kills">0</span>
                            </span>
                            <span class="meta-sep">•</span>
                            <span class="meta-item">
                                <span class="meta-label">С</span>
                                <span class="meta-value" id="meta-deaths">0</span>
                            </span>
                        </div>
                    </div>
                </div>

                <!-- Круг с винрейтом + W/L -->
                <div class="winrate-block">
                    <div class="winrate-circle">
                        <svg viewBox="0 0 100 100" class="winrate-svg">
                            <circle class="winrate-bg" cx="50" cy="50" r="42"></circle>
                            <circle class="winrate-progress" cx="50" cy="50" r="42"
                                    id="winrate-circle"></circle>
                        </svg>
                        <div class="winrate-center">
                            <div class="winrate-percent" id="winrate-percent">0%</div>
                            <div class="winrate-label">Winrate</div>
                        </div>
                    </div>
                    <div class="wl-info">
                        <div class="wl-row">
                            <div class="wl-value win" id="wl-wins">0</div>
                            <div class="wl-label">Побед</div>
                        </div>
                        <div class="wl-row">
                            <div class="wl-value lose" id="wl-losses">0</div>
                            <div class="wl-label">Поражений</div>
                        </div>
                    </div>
                </div>

                <!-- Место в топе + Монеты -->
                <div class="info-grid">
                    <div class="info-card">
                        <div class="info-icon">🏆</div>
                        <div class="info-value" id="info-rank">—</div>
                        <div class="info-label">Место в топе</div>
                    </div>
                    <div class="info-card">
                        <div class="info-icon">💰</div>
                        <div class="info-value" id="info-coins">0</div>
                        <div class="info-label">Монеты</div>
                    </div>
                </div>

                <!-- КД по картам -->
                <div class="maps-section">
                    <h3 class="maps-title">КД по картам</h3>
                    <div class="maps-list" id="kd-maps-list"></div>
                </div>

                <!-- Винрейт по картам -->
                <div class="maps-section">
                    <h3 class="maps-title">Винрейт по картам</h3>
                    <div class="maps-list" id="wr-maps-list"></div>
                </div>

            </section>

            <!-- ВКЛАДКА: СОЗДАНИЕ ЛОББИ -->
            <section class="tab-content" id="tab-create">
                <h2 class="section-title">Создать лобби</h2>

                <form id="lobby-form" class="lobby-form">
                    <div class="form-group">
                        <label class="form-label">Режим</label>
                        <div class="chips" id="mode-chips">
                            <button type="button" class="chip" data-value="1x1">1х1</button>
                            <button type="button" class="chip" data-value="2x2">2х2</button>
                            <button type="button" class="chip" data-value="3x3">3х3</button>
                            <button type="button" class="chip" data-value="4x4">4х4</button>
                            <button type="button" class="chip active" data-value="5x5">5х5</button>
                        </div>
                        <input type="hidden" name="mode" id="mode-input" value="5x5">
                    </div>

                    <div class="form-group">
                        <label class="form-label">Карта</label>
                        <div class="chips" id="map-chips">
                            <button type="button" class="chip active" data-value="Sandstone">Sandstone</button>
                            <button type="button" class="chip" data-value="Province">Province</button>
                            <button type="button" class="chip" data-value="Rust">Rust</button>
                            <button type="button" class="chip" data-value="Prison">Prison</button>
                            <button type="button" class="chip" data-value="Hanami">Hanami</button>
                        </div>
                        <input type="hidden" name="map" id="map-input" value="Sandstone">
                    </div>

                    <div class="form-group">
                        <label class="form-label">Комментарий</label>
                        <textarea
                            name="comment"
                            class="form-input"
                            placeholder="Например: нужен микрофон, играем на победу..."
                            rows="3"
                            maxlength="200"
                        ></textarea>
                    </div>

                    <button type="submit" class="btn-primary">
                        🚀 Создать лобби
                    </button>
                </form>
            </section>

            <!-- ВКЛАДКА: ТОП -->
            <section class="tab-content" id="tab-top">
                <h2 class="section-title">Топ игроков</h2>
                <div class="top-list" id="top-list"></div>
            </section>

        </main>

        <!-- Нижняя навигация -->
        <nav class="tabbar">
            <button class="tab-btn active" data-tab="profile">
                <span class="tab-icon">👤</span>
                <span class="tab-text">Профиль</span>
            </button>
            <button class="tab-btn" data-tab="create">
                <span class="tab-icon">🎮</span>
                <span class="tab-text">Лобби</span>
            </button>
            <button class="tab-btn" data-tab="top">
                <span class="tab-icon">🏆</span>
                <span class="tab-text">Топ</span>
            </button>
        </nav>
    </div>

    <div class="toast" id="toast"></div>

    <script src="app.js"></script>
</body>
</html>
