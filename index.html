<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: sans-serif; padding: 20px; background: var(--tg-theme-bg-color, #fff); color: var(--tg-theme-text-color, #000); }
        button { padding: 12px 24px; font-size: 16px; border-radius: 8px; border: none; background: var(--tg-theme-button-color, #2ea6ff); color: var(--tg-theme-button-text-color, #fff); }
    </style>
</head>
<body>
    <h1>Привет из Mini App! 👋</h1>
    <p>Пользователь: <span id="user">...</span></p>
    <button onclick="sendData()">Отправить данные боту</button>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.ready();

        const user = tg.initDataUnsafe?.user;
        if (user) {
            document.getElementById("user").textContent = user.first_name;
        }

        function sendData() {
            tg.sendData(JSON.stringify({ action: "hello", time: Date.now() }));
        }
    </script>
</body>
</html>
